<style>
:root {
  --bg: #F3F6FC; --surface: #ffffff; --surface-2: #EDF1F9; --border: #DCE3F0; --border-strong: #C3CEE3;
  --text: #0A0F2E; --muted: #4A5873; --faint: #66738C; --accent: #0077B6; --accent-ink: #ffffff; --accent-soft: #E0F2FB;
  --good: #0F7B47; --good-soft: #DCF5E7; --warn: #9A5B00; --warn-soft: #FCEFD5; --bad: #C22F2F; --bad-soft: #FDE4E4; --info-soft: #E3EFFB;
  --c-local: #0E8A7D; --c-fast: #2F7FC9; --c-standard: #4F5BD5; --c-strong: #8A4FD0; --c-frontier: #C23A86; --c-specialist: #B8681A;
  --shadow: 0 1px 2px rgba(10,15,46,.05), 0 4px 16px rgba(10,15,46,.05); --glow: rgba(0,119,182,.06); --brand-a: #0A0F2E; --brand-b: #0077B6;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F2E; --surface: #111833; --surface-2: #18234D; --border: #1C2A5C; --border-strong: #1E3A8A;
    --text: #E2E8F0; --muted: #94A3B8; --faint: #7D8CA3; --accent: #00D4FF; --accent-ink: #0A0F2E; --accent-soft: #0B2F4D;
    --good: #34D399; --good-soft: #0E2B2C; --warn: #FBBF24; --warn-soft: #2E2612; --bad: #F87171; --bad-soft: #3A1625; --info-soft: #0F2547;
    --c-local: #2DD4BF; --c-fast: #60A5FA; --c-standard: #818CF8; --c-strong: #C084FC; --c-frontier: #F472B6; --c-specialist: #FB923C;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(2,6,23,.35); --glow: rgba(0,212,255,.07); --brand-a: #FFFFFF; --brand-b: #00D4FF;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F2E; --surface: #111833; --surface-2: #18234D; --border: #1C2A5C; --border-strong: #1E3A8A;
  --text: #E2E8F0; --muted: #94A3B8; --faint: #7D8CA3; --accent: #00D4FF; --accent-ink: #0A0F2E; --accent-soft: #0B2F4D;
  --good: #34D399; --good-soft: #0E2B2C; --warn: #FBBF24; --warn-soft: #2E2612; --bad: #F87171; --bad-soft: #3A1625; --info-soft: #0F2547;
  --c-local: #2DD4BF; --c-fast: #60A5FA; --c-standard: #818CF8; --c-strong: #C084FC; --c-frontier: #F472B6; --c-specialist: #FB923C;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(2,6,23,.35); --glow: rgba(0,212,255,.07); --brand-a: #FFFFFF; --brand-b: #00D4FF;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg) radial-gradient(1200px 420px at 50% -120px, var(--glow), transparent 70%) no-repeat; color: var(--text); font: 14px/1.45 var(--sans); min-height: 100vh; }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; } h3 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: .92em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* shell */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); }
.bar { max-width: 1280px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand .wm { background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand small { font-weight: 500; color: var(--faint); font-size: 12px; letter-spacing: 0; text-transform: none; }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
nav.tabs { max-width: 1280px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; padding: 10px 12px 11px; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs .count { color: var(--faint); font-weight: 500; margin-left: 4px; font-size: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 64px; }
.panel { display: none; } .panel.on { display: block; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel.on { animation: none; } * { transition: none !important; } }

/* primitives */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card > .head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card > .body { padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat { padding: 13px 16px; }
.stat .k { color: var(--muted); font-size: 12px; font-weight: 550; }
.stat .v { font-size: 26px; font-weight: 680; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--faint); font-size: 12px; margin-top: 1px; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 6px 11px; font-weight: 550; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); } .btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; } .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
input[type=search] { flex: 1 1 220px; max-width: 320px; }
input[type=text], input[type=password], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 92px; font-family: var(--sans); }
select { padding: 4px 6px; border-radius: 6px; }
input::placeholder, textarea::placeholder { color: var(--faint); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--accent); }
.cat { --c: var(--faint); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
.cat::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.cat.local { --c: var(--c-local); } .cat.fast { --c: var(--c-fast); } .cat.standard { --c: var(--c-standard); }
.cat.strong { --c: var(--c-strong); } .cat.frontier { --c: var(--c-frontier); } .cat.specialist { --c: var(--c-specialist); }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; background: var(--warn-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.banner b { font-weight: 650; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--text); }
td { padding: 6px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
tr.off td { opacity: .5; }
td .pill { padding: 0 6px; }
td.id { font-family: var(--mono); font-size: 12px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.bar-mini { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.bar-mini > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chip { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--surface-2); font-size: 11.5px; color: var(--muted); margin-right: 3px; white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 30px; height: 18px; display: inline-block; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 9px; background: var(--border-strong); transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + i { background: var(--accent); } .switch input:checked + i::after { transform: translateX(12px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* quota */
.q { display: grid; gap: 3px; min-width: 150px; }
.q .line { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
.q .track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 50px; }
.q .track i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.q .track i.low { background: var(--warn); } .q .track i.crit { background: var(--bad); }
.q .lbl { width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.stack i { display: block; height: 100%; background: var(--c); min-width: 3px; } .stack i.local { --c: var(--c-local); } .stack i.fast { --c: var(--c-fast); }
.stack i.standard { --c: var(--c-standard); } .stack i.strong { --c: var(--c-strong); } .stack i.frontier { --c: var(--c-frontier); } .stack i.specialist { --c: var(--c-specialist); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }

/* code */
.code { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; overflow: auto; max-height: 340px; }
.code pre { margin: 0; font: 12px/1.55 var(--mono); white-space: pre; }
.code .btn { position: absolute; top: 7px; right: 7px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; font-weight: 550; font-size: 13px; color: var(--muted); border-right: 1px solid var(--border-strong); }
.seg button:last-child { border-right: 0; } .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ladder td, .ladder th { padding: 5px 8px; } .ladder select { width: 100%; min-width: 92px; }
.ladder select.changed { border-color: var(--accent); background: var(--accent-soft); }
.field { display: grid; gap: 5px; } .field > label { font-weight: 600; font-size: 12.5px; }
.hint { color: var(--faint); font-size: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); padding: 9px 13px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); animation: fade .15s; }
.toast.bad { background: var(--bad); color: #fff; }
.gate { max-width: 520px; margin: 12vh auto; padding: 0 16px; }

@media (max-width: 980px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2, .g3 { grid-template-columns: 1fr; }
  .stat .v { font-size: 22px; } main { padding-top: 12px; } .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="mh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><linearGradient id="me" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#00D4FF"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="#0A0F2E"/><path d="M15 22V13M49 22V13" stroke="#3B82F6" stroke-width="2"/><circle cx="15" cy="11" r="3" fill="#3B9BFF"/><circle cx="49" cy="11" r="3" fill="#3B9BFF"/><rect x="5" y="26" width="7" height="17" rx="3.5" fill="url(#me)"/><rect x="52" y="26" width="7" height="17" rx="3.5" fill="url(#me)"/><path d="M14 23Q32 13 50 23V41L32 56 14 41Z" fill="url(#mh)"/><path d="M19 28H45V39.5L32 50 19 39.5Z" fill="#0A0F2E"/><circle cx="26.5" cy="34" r="3" fill="#7DE3FF"/><circle cx="37.5" cy="34" r="3" fill="#7DE3FF"/><path d="M28 41Q32 44 36 41" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="wm">Maestro</span> <small id="ver"></small></div>
    <span class="spacer"></span>
    <span class="live" id="live"><span class="dot"></span><span>connecting</span></span>
    <button class="btn sm ghost" id="theme" title="Switch between light, dark and automatic">Theme</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
const TABS = [["overview", "Overview"], ["providers", "Providers"], ["models", "Models"], ["routing", "Routing"], ["activity", "Activity"], ["try", "Try it"]];
const CATS = ["local", "fast", "standard", "strong", "frontier"];
const CAT_HINT = {local: "a model on your machine or network", fast: "cheap and quick", standard: "the everyday workhorse", strong: "top reasoning", frontier: "the very best"};
let S = null, token = "", tab = "overview", timers = {};
const ui = {alts: false, snip: "hermes", provFilter: "configured", provQuery: "", modelQuery: "", modelCat: "", modelAccess: "", modelSort: ["G", -1], showAllProviders: false,
            activity: {paused: false, rows: [], open: null}, tryRes: null, ladderDraft: null, pinsDraft: null, showKeyFor: null};
const store = {get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }};

/* ---------- tiny DOM helper (no innerHTML: every value is set as text) ---------- */
function add(el, kids) { for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); } return el; }
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "for") el.htmlFor = v;
    else if (["value", "checked", "disabled", "title", "type", "placeholder", "href", "selected", "rows", "colSpan", "name", "autocomplete", "spellcheck"].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  return add(el, kids);
}
const $ = (s, r) => (r || document).querySelector(s);
function toast(msg, bad) { const t = h("div", {class: "toast" + (bad ? " bad" : "")}, msg); $("#toasts").append(t); setTimeout(() => t.remove(), bad ? 6500 : 3200); }

/* ---------- formatting ---------- */
const fmt = {
  money(v) { if (v == null) return "–"; if (v === 0) return "$0"; const a = Math.abs(v); return "$" + (a < 0.01 ? v.toFixed(4) : a < 1 ? v.toFixed(3) : a < 100 ? v.toFixed(2) : v.toFixed(0)); },
  price(v) { return v == null ? "–" : v === 0 ? "free" : "$" + (v < 1 ? v.toFixed(2) : v % 1 ? v.toFixed(2).replace(/0$/, "") : v); },
  ctx(v) { return !v ? "–" : v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "M" : Math.round(v / 1e3) + "k"; },
  score(v) { return v == null ? "–" : v.toFixed(2).replace(/^0/, ""); },
  ago(ts) { if (!ts) return "–"; const s = Math.max(0, Date.now() / 1000 - ts); return s < 5 ? "just now" : s < 90 ? Math.round(s) + "s ago" : s < 5400 ? Math.round(s / 60) + "m ago" : s < 129600 ? Math.round(s / 3600) + "h ago" : Math.round(s / 86400) + "d ago"; },
  until(ts) { if (!ts) return ""; const s = ts - Date.now() / 1000; if (s <= 0) return "now"; return s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : s < 129600 ? (s / 3600).toFixed(s < 36000 ? 1 : 0) + "h" : Math.round(s / 86400) + "d"; },
  tok(v) { return v == null ? "–" : v >= 1e4 ? (v / 1e3).toFixed(1) + "k" : String(v); },
  ms(v) { return v == null ? "–" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms"; },
  pct(v) { return v == null ? "–" : Math.round(v * 100) + "%"; },
};
const catPill = (c, extra) => c ? h("span", {class: "cat " + c, title: CAT_HINT[c] || ""}, c, extra || "") : h("span", {class: "faint"}, "–");
const accessLabel = {"api": "API", "subscription-cli": "Subscription", "local": "Local"};
