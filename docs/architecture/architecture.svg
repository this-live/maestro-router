    <rect x="660" y="280" width="150" height="64" rx="6" class="plate"/>
    <rect x="660" y="280" width="150" height="64" rx="6" class="box-cloud" stroke-width="1.5"/>
    <g aria-hidden="true" class="icon icon-cloud" transform="translate(666 286) scale(0.6875)">
      <path d="M4.3 12.5h7.3a2.4 2.4 0 0 0 .2-4.8 4 4 0 0 0-7.5-1.3A3.1 3.1 0 0 0 4.3 12.5Z"/>
