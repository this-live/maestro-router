    <text x="105" y="310" class="label" font-size="11" font-weight="600" text-anchor="middle">Operator</text>
    <text x="105" y="326" class="sublabel" font-size="9" text-anchor="middle">CLI / Hermes / HTTP</text>
  </g>

  <g id="node-cli">
    <title>maestro CLI · route and serve · Maestro runtime</title>
    <rect x="230" y="280" width="130" height="64" rx="6" class="plate"/>
    <rect x="230" y="280" width="130" height="64" rx="6" class="box-backend" stroke-width="1.5"/>
