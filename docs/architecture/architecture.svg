    <text x="500" y="326" class="sublabel" font-size="9" text-anchor="middle">classify → ladder</text>
    <text x="500" y="336" class="tag-backend" font-size="7" text-anchor="middle">11 jobs</text>
  </g>

  <g id="node-catalog">
