<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 592" width="1080" height="592" role="img" lang="en" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Maestro — model router runtime</title>
  <desc id="diagram-desc">The Maestro 3.1.0 runtime: the command line and the HTTP server both send a task to the router, which classifies it, walks the policy ladder against the inventory of models you can run, and picks a local endpoint, a cloud seat or a specialist; an optional JEV classifier and local feedback learning sit alongside.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    .bg { fill: #030711; }
    .grid-line { stroke: #15233a; fill: none; }
    .plate { fill: #07101e; stroke: none; }
    .halo { fill: none; stroke: #07101e; }
    .box-backend { fill: rgba(16,185,129,0.14); stroke: #5eead4; }
    .icon-backend { color: #5eead4; }
    .box-database { fill: rgba(139,92,246,0.16); stroke: #c4b5fd; }
    .icon-database { color: #c4b5fd; }
    .box-cloud { fill: rgba(245,158,11,0.13); stroke: #fcd34d; }
    .icon-cloud { color: #fcd34d; }
    .box-external { fill: rgba(71,85,105,0.24); stroke: #a5b4c7; }
    .icon-external { color: #a5b4c7; }
    .region { fill: rgba(251,191,36,0.05); stroke: #fcd34d; stroke-dasharray: 8,4; }
    .label { fill: #f5fbff; }
    .sublabel { fill: #9eb0c7; }
    .tag-backend { fill: #5eead4; }
    .tag-cloud { fill: #fcd34d; }
    .edge-label { fill: #7890ad; }
    .edge-label-main { fill: #2dd4bf; }
    .edge-label-optional { fill: #c4b5fd; }
    .edge { stroke: #7890ad; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px #2dd4bf); }
    .edge-main { stroke: #2dd4bf; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px #2dd4bf); }
    .edge-optional { stroke: #c4b5fd; fill: none; stroke-dasharray: 4,4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px #2dd4bf); }
    .arrow { fill: #7890ad; }
    .arrow-main { fill: #2dd4bf; }
    .arrow-optional { fill: #c4b5fd; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; }
    .icon > * { vector-effect: non-scaling-stroke; }
  </style>
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
    <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-main" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-optional" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid-line" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Boundaries (behind everything) -->
  <rect x="200" y="90" width="840" height="434" rx="12" class="region" stroke-width="1"/>

