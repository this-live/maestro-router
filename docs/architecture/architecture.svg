      <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
    </g>
    <text x="295" y="310" class="label" font-size="11" font-weight="600" text-anchor="middle">maestro CLI</text>
    <text x="295" y="326" class="sublabel" font-size="9" text-anchor="middle">route and serve</text>
  </g>

  <g id="node-decide">
    <title>decide / router · classify → ladder · Maestro runtime · 11 jobs</title>
    <rect x="430" y="280" width="140" height="64" rx="6" class="plate"/>
    <rect x="430" y="280" width="140" height="64" rx="6" class="box-backend" stroke-width="1.5"/>
    <g aria-hidden="true" class="icon icon-backend" transform="translate(436 286) scale(0.6875)">
      <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
