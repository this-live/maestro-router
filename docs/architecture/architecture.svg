  </g>

  <!-- Components -->
  <g id="node-user">
    <title>Operator · CLI / Hermes / HTTP</title>
    <rect x="40" y="280" width="130" height="64" rx="6" class="plate"/>
    <rect x="40" y="280" width="130" height="64" rx="6" class="box-external" stroke-width="1.5"/>
